name: broad-screen

# 2026-08-29 신설 - 34종목 손입력 큐를 넘어서는 대규모 스크리닝(scripts/broad_screen.py).
# SEC 등록 전체 티커(약 1만개, 이름 사전필터 후 약 9천개 시도)를 모집단으로
# engine.screener.screen()을 그대로 돌린다. 새 밸류에이션 로직 0줄 -
# 자세한 설계 근거는 scripts/broad_screen.py 상단 docstring 참고.
#
# ⚠️ 매일 돌리지 않고 **주 1회**다 - 이 스크리닝이 쓰는 원자료(매출·OCF·capex는
# 분기/연차 공시, 시총 근사치 public_float은 연 1회 10-K 스냅샷)가 애초에
# 하루 단위로 변하지 않는다. daily-screen.yml(Finviz 52주 신저가 기반, 실제로
# 매일 다른 후보가 뜬다)과 이 워크플로는 목적이 다르다 - 그쪽은 "오늘 급락한
# 종목", 이쪽은 "미국 상장기업 전체를 훑었을 때 구조적으로 저평가로 보이는
# 종목"이다.
#
# 시크릿 불필요 - SEC만 쓴다(1차자료·완전준수, 시크릿 발급 절차 자체가 없음).
# 필요한 저장소 권한은 daily-screen.yml과 동일(issues write / contents write).

on:
  schedule:
    # 매주 토요일 01:00 UTC(= 10:00 KST) - 평일 아침 브리핑과 안 겹치게,
    # 그 주 마지막 거래일 데이터까지 반영된 뒤 돈다.
    - cron: "0 1 * * 6"
  workflow_dispatch:
    inputs:
      limit:
        description: "유니버스 앞 N개만 처리(비우면 전체, 테스트 시 100~500 권장)"
        required: false
        default: ""

permissions:
  issues: write
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    # 실측(2026-08-29, 300종목 파일럿): 140초/300종목 ≈ 0.47초/종목. 사전필터
    # 후 유니버스가 약 8,900종목이므로 전체 실행 예상 ≈ 70분. GitHub Actions
    # 러너의 네트워크 특성이 다를 수 있어 넉넉히 120분.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # engine/은 여전히 stdlib만 쓴다 - 이 워크플로도 추가 설치가 없다.
      - name: run broad screen (Stage 1, SEC 전용)
        id: screen
        env:
          SEC_USER_AGENT: "IRS Research chlalsrl1203@gmail.com"
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="--limit ${{ github.event.inputs.limit }}"
          fi
          python3 scripts/broad_screen.py $ARGS

      - name: post result to GitHub Issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/broad_screen_post.py

      - name: commit report
        if: always()
        run: |
          git config user.name "irs-broad-screen[bot]"
          git config user.email "irs-broad-screen-bot@users.noreply.github.com"
          git add reports/broad_screen/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "새 리포트 없음 - 커밋 건너뜀"
          else
            git commit -m "reports: $(date -u +%Y-%m-%d) 대규모 스크리닝 결과"
            git push
          fi

      - name: upload result json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broad-screen-result
          path: reports/broad_screen/*.json
          if-no-files-found: ignore
