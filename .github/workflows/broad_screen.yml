name: broad-screen

# 2026-08-29 신설 - 34종목 손입력 큐를 넘어서는 대규모 스크리닝(scripts/broad_screen.py).
# SEC 등록 전체 티커(약 1만개, 이름 사전필터 후 약 9천개 시도)를 모집단으로
# engine.screener.screen()을 그대로 돌린다. 새 밸류에이션 로직 0줄 -
# 자세한 설계 근거는 scripts/broad_screen.py 상단 docstring 참고.
#
# ⚠️ 매일 돌리지 않고 **주 1회**다 - 이 스크리닝이 쓰는 원자료(매출·OCF·capex는
# 분기/연차 공시, 시총 근사치 public_float은 연 1회 10-K 스냅샷)가 애초에
# 하루 단위로 변하지 않는다. daily-screen.yml(Finviz 52주 신저가 기반, 실제로
# 매일 다른 후보가 뜬다)과 이 워크플로는 목적이 다르다 - 그쪽은 "오늘 급락한
# 종목", 이쪽은 "미국 상장기업 전체를 훑었을 때 구조적으로 저평가로 보이는
# 종목"이다.
#
# **위 판단을 2026-08-30에 실측으로 확인했다**(매일 실행 검토 중 SEC 일일 공시
# 색인 `Archives/edgar/daily-index/YYYY/QTRn/form.YYYYMMDD.idx`를 직접 조회):
#   - 하루에 **연차보고서(10-K/10-K/A/20-F/20-F/A/40-F)를 내는 회사는 10~13곳**
#     이다(08-27: 13건, 08-28: 10건). 유니버스 약 8,900종목 대비 0.15% 미만.
#   - `engine/data/providers/sec.py::_annual_entries`는 ANNUAL_FORMS가 아닌 항목을
#     전부 버리므로 **10-Q가 새로 올라와도 이 스크리닝 결과는 바뀔 수 없다.**
#   - 즉 매일 전체를 돌리면 종목당 ~3.4MB × 8,900 = **하루 약 30GB를 받는데
#     그중 99.8%가 어제와 완전히 같은 파일**이고, 러너 시간도 매일 135~180분이
#     소모된다.
# 일일 색인으로 "바뀐 종목만" 재채점하는 증분 실행도 검토했으나, 주 1회
# 전체 실행을 유지하기로 한 이상 증분이 할 일이 없어 **만들지 않았다**
# (Simplicity First - 쓰지 않을 기능은 넣지 않는다). 매일 실행이 정말
# 필요해지면 그때 위 색인 경로로 증분을 배선할 것 - 근거 수치는 여기 있다.
#
# 시크릿 불필요 - SEC만 쓴다(1차자료·완전준수, 시크릿 발급 절차 자체가 없음).
# 필요한 저장소 권한은 daily-screen.yml과 동일(issues write / contents write).

on:
  schedule:
    # 매주 토요일 01:00 UTC(= 10:00 KST) - 평일 아침 브리핑과 안 겹치게,
    # 그 주 마지막 거래일 데이터까지 반영된 뒤 돈다.
    - cron: "0 1 * * 6"
  workflow_dispatch:
    inputs:
      limit:
        description: "유니버스 앞 N개만 처리(비우면 전체, 테스트 시 100~500 권장)"
        required: false
        default: ""

permissions:
  issues: write
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    # ⚠️ 타임아웃 산정을 한 번 틀렸다(2026-08-29). 300종목 파일럿의
    # 140초/300 ≈ 0.47초/종목으로 "전체 70분"이라 보고 120분을 걸었는데,
    # 같은 날 1200종목 실행 중 30초 구간을 실측하니 **0.91초/종목**이었다
    # (companyfacts가 종목당 ~3.4MB라 다운로드가 지배적이고, 네트워크·CDN
    # 상태에 따라 2배까지 흔들린다). 8,900종목 × 0.91초 ≈ **135분**으로
    # 120분 타임아웃을 그대로 넘긴다 - 첫 주간 실행이 통째로 실패했을 것이다.
    #
    # 추정 대신 실측값에 여유를 곱해 잡는다: 8,900 × 1.2초 ≈ 178분 → 300분.
    # (GitHub Actions 표준 러너의 job 상한은 6시간이라 300분은 그 안이다.)
    # 더 늘려야 하면 타임아웃을 키우는 대신 유니버스를 샤딩할 것 - 한 job이
    # 6시간에 근접하면 실패 시 재실행 비용이 지나치게 커진다.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # ⚠️ 2026-08-30 첫 실행에서 잡힌 결함: 원래 이 자리에 설치 단계가 없었고
      # 주석에 "이 워크플로도 추가 설치가 없다"고 적혀 있었다. 스크리닝 본체
      # (broad_screen.py -> engine/)는 실제로 stdlib만 쓰므로 그 부분은 맞지만,
      # **결과를 GitHub Issue에 올리는 broad_screen_post.py가 `requests`를 쓴다.**
      # 그래서 첫 실행에서 스크리닝은 55분간 정상 완주했는데 게시 단계만
      # `ModuleNotFoundError: No module named 'requests'`로 죽었다(결과 커밋·
      # 아티팩트는 `if: always()` 덕에 살아남아 실패가 눈에 잘 안 띄었다).
      # daily_screen.yml은 이미 같은 이유로 requests를 설치하고 있었다 -
      # 그쪽 게시가 계속 정상 작동한 것이 대조 증거다.
      - name: install deps (게시 단계 전용 - 스크리닝 본체는 stdlib만 쓴다)
        run: pip install requests
      - name: run broad screen (Stage 1, SEC 전용)
        id: screen
        env:
          SEC_USER_AGENT: "IRS Research chlalsrl1203@gmail.com"
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="--limit ${{ github.event.inputs.limit }}"
          fi
          python3 scripts/broad_screen.py $ARGS

      - name: post result to GitHub Issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/broad_screen_post.py

      - name: commit report
        if: always()
        run: |
          git config user.name "irs-broad-screen[bot]"
          git config user.email "irs-broad-screen-bot@users.noreply.github.com"
          git add reports/broad_screen/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "새 리포트 없음 - 커밋 건너뜀"
          else
            git commit -m "reports: $(date -u +%Y-%m-%d) 대규모 스크리닝 결과"
            git push
          fi

      - name: upload result json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broad-screen-result
          path: reports/broad_screen/*.json
          if-no-files-found: ignore
