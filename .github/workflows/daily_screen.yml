name: daily-screen

# 2026-08-22 신설 - 클로드 세션의 예약실행(Routine) 기능이 이 환경에서 승인
# 처리가 안 되는 버그로 막혀 GitHub Actions로 대체했다. 클로드 세션 상태와
# 완전히 무관하게 GitHub 자체 서버에서 돈다.
#
# 필요한 저장소 시크릿(Settings -> Secrets and variables -> Actions):
#   ALPHA_VANTAGE_API_KEY - alphavantage.co 무료 가입으로 발급(개인 키,
#                           클로드 세션에서 저녁에 쓰는 것과 별개 쿼터)
#
# 2026-08-23: 결과기록을 Notion에서 GitHub Issue로 교체했다 - Notion 통합
# 토큰 발급·시크릿 등록·페이지 연결 3단계가 필요했고 실제로 토큰이 401로
# 계속 거부돼 완전자동화의 병목이 됐다. GitHub Issue는 워크플로가 실행마다
# 자동으로 받는 `secrets.GITHUB_TOKEN`만 쓰므로 **추가 발급·등록이 전혀
# 없다** - 다만 기본 권한이 read-only라 아래 `permissions:`로 issues 쓰기를
# 명시적으로 열어줘야 한다(안 열면 403).
#
# 시크릿이 없어도 워크플로 자체는 실패하지 않는다 - Finviz+SEC 부분만 돌고
# 로그에 "시크릿 미설정"이라고 정직하게 남긴다(scripts/daily_screen_ci.py 참고).

on:
  schedule:
    # 00:00 UTC = 09:00 KST, 평일만(cron 요일은 UTC 기준이지만 +9시간이라
    # 날짜가 안 바뀌므로 요일 필드 그대로 1-5 사용)
    - cron: "0 0 * * 1-5"
  workflow_dispatch: {}   # 수동 실행(테스트용) 버튼도 열어둔다

permissions:
  issues: write    # GITHUB_TOKEN 기본 권한은 read-only라 명시적으로 열어야 함
  contents: write  # 2026-08-23(v3.65): reports/deep_screen/ 스냅샷을 커밋하려면 필요

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps (CI 전용 - engine/은 여전히 stdlib만 쓴다)
        run: |
          pip install playwright requests
          playwright install --with-deps chromium
      - name: run daily screen
        id: screen
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/daily_screen_ci.py

      # 2026-08-23(v3.64): 보유종목 감시는 평소 위 단계의 코멘트에 합쳐 나간다
      # (알림 하루 1건 유지). 이 단계는 **위가 실패했을 때만** 돈다 - 감시는
      # 네트워크 의존이 전혀 없는데(ledger + 날짜만 본다) Finviz/Playwright
      # 장애로 같이 멈추면, 이 감시가 막으려는 실패("아무도 안 본다")가 그대로
      # 재발하기 때문이다.
      - name: run monitor standalone (스크리닝 실패 시 대체 경로)
        if: failure() && steps.screen.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/daily_monitor_ci.py --post

      # 2026-08-23(v3.65): 심층분석 스냅샷은 다음날 "전일 대비 변화"를 보려면
      # 이 checkout 안에 남아 있어야 하는데, 러너는 매번 새로 뜬다 - 커밋하지
      # 않으면 항상 prior=None이라 변화탐지가 영구히 작동하지 않는다.
      # **오직 reports/deep_screen/만** 건드린다(엔진 코드·ledger·CLAUDE.md
      # 등은 여기서 절대 커밋되지 않는다) - 판정 로직이 아니라 SEC 원자료를
      # 재계산한 객관적 스냅샷이라 사람 검토 없이 쌓아도 안전하다(주관적
      # 판단이 필요한 monitor/acknowledgements.json은 반대로 사람이 커밋한다).
      - name: commit deep-screen snapshots (있을 때만)
        if: always()
        run: |
          git config user.name "irs-daily-screen[bot]"
          git config user.email "irs-daily-screen-bot@users.noreply.github.com"
          git add reports/deep_screen/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "새 스냅샷 없음 - 커밋 건너뜀"
          else
            git commit -m "reports/deep_screen: $(date -u +%Y-%m-%d) 자동 스냅샷"
            git push
          fi

      - name: upload monitor json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-monitor-result
          path: /tmp/daily_monitor_*.json
          if-no-files-found: ignore

      - name: upload result json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-screen-result
          path: /tmp/daily_screen_ci_*.json
          if-no-files-found: ignore
      - name: upload finviz debug html (있을 때만)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finviz-debug-html
          path: /tmp/finviz_debug_*.html
          if-no-files-found: ignore
